server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: sve rute (npr. /iot, /fermentation/:id) vraćaju index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashirani asseti se mogu dugo keširati
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
