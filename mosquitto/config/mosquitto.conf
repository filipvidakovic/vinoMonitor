# Mosquitto broker za vinoMonitor IoT
listener 1883
protocol mqtt

# Razvoj: anonimni pristup. Za produkciju:
#   docker exec vinomonitor-mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd <user> <pass>
# pa zameni sledeće dve linije sa:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# i postavi MQTT_USERNAME/MQTT_PASSWORD u iot-service i settings.json na uređaju.
allow_anonymous true

# Čuva retained poruke (status uređaja) i QoS1 poruke između restartova
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
